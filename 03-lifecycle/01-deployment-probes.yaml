# TP3a — l'API avec ses trois sondes.
# liveness  : le process est-il vivant ?  -> redémarrage du container si KO
# readiness : peut-il recevoir du trafic ? -> retrait des Endpoints si KO (pas de redémarrage)
# startup   : laisse le temps de démarrer avant d'activer les deux autres
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-api
  labels:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/part-of: skyboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: skyboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyboard-api
        app.kubernetes.io/part-of: skyboard
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: api
          image: k3d-registry.localhost:5000/skyboard-api:v1
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: AIRPORT, value: "LFBO" }
            - { name: APP_VERSION, value: "v1" }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15          # jusqu'à 30 s pour démarrer
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3           # 15 s de silence -> restart
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 1           # retrait immédiat du trafic
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
