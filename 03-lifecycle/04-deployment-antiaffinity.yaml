# TP3b — étaler les réplicas sur les nœuds (anti-affinité pod) et préférer les agents (affinité node)
# Patch à appliquer : kubectl patch deployment skyboard-api --patch-file 04-deployment-antiaffinity.yaml
spec:
  template:
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:   # « preferred » : 3 réplicas pour 2 agents
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: skyboard-api
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
