# TP3b — démarrer et s'arrêter proprement
# - init container : attend que le Service redis réponde avant de lancer l'API
# - preStop + terminationGracePeriodSeconds : séquence d'arrêt maîtrisée
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-api
  labels:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/part-of: skyboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: skyboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyboard-api
        app.kubernetes.io/part-of: skyboard
        app.kubernetes.io/version: v1
    spec:
      terminationGracePeriodSeconds: 20   # > preStop + SHUTDOWN_DELAY, sinon SIGKILL
      initContainers:
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do echo 'attente de redis...'; sleep 2; done; echo 'redis prêt'"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: api
          image: k3d-registry.localhost:5000/skyboard-api:v1
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: AIRPORT, value: "LFBO" }
            - { name: APP_VERSION, value: "v1" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: SHUTDOWN_DELAY, value: "5" }
          lifecycle:
            postStart:
              exec: { command: ["sh", "-c", "echo 'postStart: container démarré' > /dev/termination-log || true"] }
            preStop:
              # Laisse le temps à kube-proxy / l'Ingress de retirer le Pod de la rotation
              # avant que SIGTERM ne soit envoyé au process.
              exec: { command: ["sh", "-c", "sleep 3"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 1
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
