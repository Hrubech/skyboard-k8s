# Atelier J3 — étape 2 : BLUE = la version en production (v1). Un label « slot » distingue les deux couleurs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-api-blue
  labels:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/part-of: skyboard
    skyboard/slot: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: skyboard-api
      skyboard/slot: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyboard-api
        app.kubernetes.io/part-of: skyboard
        app.kubernetes.io/version: v1
        skyboard/slot: blue
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: k3d-registry.localhost:5000/skyboard-api:v1
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: skyboard-api-config }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 3"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
