# Atelier J3 — étape 6 : un Service dédié à la version canary (ici : les Pods green/v2)
apiVersion: v1
kind: Service
metadata:
  name: skyboard-api-canary
  labels: { app.kubernetes.io/name: skyboard-api, app.kubernetes.io/part-of: skyboard }
spec:
  selector:
    app.kubernetes.io/name: skyboard-api
    skyboard/slot: green
  ports: [{ name: http, port: 8000, targetPort: http }]
