apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skyboard.fullname" . }}-api-config
  labels:
    {{- include "skyboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: skyboard-api
data:
  AIRPORT: {{ .Values.api.airport | quote }}
  APP_VERSION: {{ include "skyboard.apiTag" . | quote }}
  FEATURE_BANNER: {{ .Values.api.featureBanner | quote }}
  SHUTDOWN_DELAY: {{ .Values.api.shutdownDelay | quote }}
  {{- if .Values.api.redisHost }}
  REDIS_HOST: {{ .Values.api.redisHost | quote }}
  {{- end }}
