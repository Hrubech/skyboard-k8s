apiVersion: v1
kind: Service
metadata:
  name: {{ include "skyboard.fullname" . }}-api
  labels:
    {{- include "skyboard.labels" . | nindent 4 }}
    app.kubernetes.io/name: skyboard-api
spec:
  selector:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 8000
      targetPort: http
