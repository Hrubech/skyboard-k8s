# TP6 — étape 2 : les identifiants ne sont JAMAIS dans un Deployment ni dans une ConfigMap.
# stringData = lisible dans le YAML source ; stocké en base64 (pas chiffré !) dans etcd.
# En production : chiffrement etcd at-rest + External Secrets / Vault, et ce fichier n'est pas commité.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels: { app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: skyboard }
type: Opaque
stringData:
  POSTGRES_USER: skyboard
  POSTGRES_PASSWORD: "changez-moi-en-TP"
  POSTGRES_DB: skyboard
  DATABASE_URL: "postgresql://skyboard:changez-moi-en-TP@postgres:5432/skyboard"
