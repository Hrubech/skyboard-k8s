# TP6 — étape 4 : l'API lit sa config dans la ConfigMap et le Secret (envFrom), plus aucune valeur en dur
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-api
  labels:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/part-of: skyboard
  annotations:
    kubernetes.io/change-cause: "config externalisée + PostgreSQL"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: skyboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyboard-api
        app.kubernetes.io/part-of: skyboard
        app.kubernetes.io/version: v1
      annotations:
        # Astuce : changer cette annotation force un rollout quand la ConfigMap change
        skyboard/config-version: "1"
    spec:
      terminationGracePeriodSeconds: 20
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo 'attente postgres'; sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: api
          image: k3d-registry.localhost:5000/skyboard-api:v1
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: skyboard-api-config }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: DATABASE_URL }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 3"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 1
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
