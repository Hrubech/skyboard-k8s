# TP6 — étape 3 : PostgreSQL avec un volume persistant (PVC créé par le volumeClaimTemplate,
# PV provisionné dynamiquement par la StorageClass local-path)
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: skyboard }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgresql }
  ports: [{ name: pg, port: 5432, targetPort: pg }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: skyboard }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgresql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgresql, app.kubernetes.io/part-of: skyboard }
    spec:
      securityContext:
        fsGroup: 70                      # groupe postgres de l'image alpine
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ name: pg, containerPort: 5432 }]
          envFrom:
            - secretRef: { name: postgres-credentials }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "skyboard"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            runAsUser: 70
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests: { storage: 512Mi }
