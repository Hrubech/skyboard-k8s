# TP6 — étape 3 bis (lecture) : un PVC écrit à la main, pour voir le cycle Pending → Bound
# (local-path a volumeBindingMode WaitForFirstConsumer : il reste Pending tant qu'aucun Pod ne l'utilise)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-claim
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests: { storage: 100Mi }
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-writer
spec:
  containers:
    - name: w
      image: busybox:1.36
      command: ["sh", "-c", "echo \"écrit le $(date)\" >> /data/journal.txt; cat /data/journal.txt; sleep infinity"]
      volumeMounts: [{ name: data, mountPath: /data }]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
  volumes:
    - name: data
      persistentVolumeClaim: { claimName: demo-claim }
