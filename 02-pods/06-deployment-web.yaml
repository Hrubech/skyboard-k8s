# TP2b — bonus : le front, qui parle à l'API par son nom DNS (skyboard-api)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-web
  labels:
    app.kubernetes.io/name: skyboard-web
    app.kubernetes.io/part-of: skyboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skyboard-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyboard-web
        app.kubernetes.io/part-of: skyboard
    spec:
      containers:
        - name: web
          image: k3d-registry.localhost:5000/skyboard-web:v1
          ports: [{ name: http, containerPort: 8080 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: skyboard-web
  labels:
    app.kubernetes.io/name: skyboard-web
    app.kubernetes.io/part-of: skyboard
spec:
  selector:
    app.kubernetes.io/name: skyboard-web
  ports:
    - name: http
      port: 8080
      targetPort: http
