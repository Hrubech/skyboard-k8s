# Pod « boîte à outils » réutilisé dans tous les TP pour tester le réseau depuis l'intérieur du cluster
# Usage : kubectl exec -it toolbox -- sh   puis   curl skyboard-api:8000/flights
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  labels:
    app.kubernetes.io/name: toolbox
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
