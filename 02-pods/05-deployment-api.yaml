# TP2b — étape 3 : le Pod devient un Deployment (3 réplicas, auto-réparation)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-api
  labels:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/part-of: skyboard
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: skyboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyboard-api
        app.kubernetes.io/part-of: skyboard
        app.kubernetes.io/version: v1
    spec:
      containers:
        - name: api
          image: k3d-registry.localhost:5000/skyboard-api:v1
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: AIRPORT, value: "LFBO" }
            - { name: APP_VERSION, value: "v1" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
