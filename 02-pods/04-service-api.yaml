# TP2b — étape 2 : exposer l'API en interne. Le selector doit correspondre aux labels des Pods.
apiVersion: v1
kind: Service
metadata:
  name: skyboard-api
  labels:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/part-of: skyboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skyboard-api
  ports:
    - name: http
      port: 8000
      targetPort: http
