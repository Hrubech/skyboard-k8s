apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-api
  labels: { app.kubernetes.io/name: skyboard-api }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: skyboard-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: skyboard-api }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          image: k3d-registry.localhost:5000/skyboard-api:v1
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: skyboard-api-config }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 3"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
