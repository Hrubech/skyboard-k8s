apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-web
  labels: { app.kubernetes.io/name: skyboard-web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: skyboard-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: skyboard-web }
    spec:
      containers:
        - name: web
          image: k3d-registry.localhost:5000/skyboard-web:v1
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
