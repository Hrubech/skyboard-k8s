apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skyboard
spec:
  rules:
    - host: dev.skyboard.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: skyboard-api, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: skyboard-web, port: { name: http } } }
