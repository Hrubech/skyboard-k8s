<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>SkyBoard</title>
<style>
  body{font-family:system-ui,sans-serif;margin:2rem;background:#0b1d33;color:#f3f6fa}
  h1{font-weight:600;letter-spacing:.04em}
  .banner{background:#f5b700;color:#000;padding:.5rem 1rem;border-radius:6px;display:none}
  table{border-collapse:collapse;width:100%;margin-top:1rem}
  th,td{padding:.5rem .75rem;border-bottom:1px solid #30465f;text-align:left}
  .meta{color:#9fb3c8;font-size:.9rem}
</style>
</head>
<body>
<h1>SkyBoard <span id="airport"></span></h1>
<div class="banner" id="banner"></div>
<p class="meta">API <span id="version">…</span> · pod <span id="pod">…</span> · source <span id="source">…</span> · visites <span id="visits">…</span></p>
<table><thead><tr><th>Vol</th><th>De</th><th>Vers</th><th>Heure</th><th>Statut</th></tr></thead><tbody id="rows"></tbody></table>
<script>
async function load(){
  try{
    const r = await fetch('/api/flights'); const d = await r.json();
    airport.textContent = d.airport; version.textContent = d.version; pod.textContent = d.pod;
    source.textContent = d.source; visits.textContent = d.visits ?? '—';
    rows.innerHTML = d.flights.map(f=>`<tr><td>${f.flight}</td><td>${f.from}</td><td>${f.to}</td><td>${f.std||f.sta||''}</td><td>${f.status}</td></tr>`).join('');
    const root = await (await fetch('/api/')).json();
    if(root.banner){banner.textContent=root.banner;banner.style.display='block'}
  }catch(e){rows.innerHTML=`<tr><td colspan="5">API indisponible : ${e}</td></tr>`}
}
load(); setInterval(load, 5000);
</script>
</body>
</html>
