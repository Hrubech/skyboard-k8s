# nginx en mode non-root : écoute sur 8080, logs sur stdout/stderr
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp; proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp; uwsgi_temp_path /tmp/uwsgi_temp; scgi_temp_path /tmp/scgi_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location /healthz { return 200 "ok\n"; }
    location /api/ {
      # Découverte de service par DNS : le Service « skyboard-api » du même namespace.
      # Résolu au démarrage de nginx : le Service doit exister avant le front (ClusterIP stable ensuite).
      proxy_pass http://skyboard-api:8000/;
      proxy_set_header Host $host;
    }
    location / { try_files $uri /index.html; }
  }
}
