# TP5 — bonus : la même exposition qu'au 06 avec la Gateway API (GatewayClass → Gateway → HTTPRoute)
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: skyboard-gw
  namespace: default
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      protocol: HTTP
      port: 8000                       # entrypoint « web » de Traefik k3s = 8000 (mappé 80 par le Service)
      allowedRoutes:
        namespaces: { from: Same }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: skyboard
  namespace: default
spec:
  parentRefs: [{ name: skyboard-gw }]
  hostnames: ["skyboard.local"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /api } }]
      backendRefs: [{ name: skyboard-api, port: 8000 }]
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: skyboard-web, port: 8080 }]
