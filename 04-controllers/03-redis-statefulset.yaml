# TP4 — étape 3 : Redis en StatefulSet (identité stable redis-0, volume dédié, Service headless)
# Remplace le Deployment du TP3b : kubectl delete deployment redis  (le Service « redis » est recréé ci-dessous)
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: skyboard
spec:
  clusterIP: None                       # headless : DNS redis-0.redis.<ns>.svc.cluster.local
  selector: { app.kubernetes.io/name: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: skyboard
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: skyboard
    spec:
      securityContext:
        fsGroup: 999                    # le volume appartient au groupe redis
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes"] # persistance AOF sur le volume
          ports: [{ name: redis, containerPort: 6379 }]
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path     # StorageClass par défaut de k3s
        resources:
          requests: { storage: 256Mi }
