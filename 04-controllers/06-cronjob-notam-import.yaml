# TP4 — étape 6 : la même tâche planifiée toutes les 2 minutes
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notam-import
  labels: { app.kubernetes.io/name: notam-import, app.kubernetes.io/part-of: skyboard }
spec:
  schedule: "*/2 * * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid          # pas deux imports en même temps
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 60
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels: { app.kubernetes.io/name: notam-import }
        spec:
          restartPolicy: OnFailure
          containers:
            - name: import
              image: busybox:1.36
              command: ["sh", "-c", "echo \"import planifié $(date +%T)\"; sleep 5; echo termine"]
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 50m, memory: 32Mi }
