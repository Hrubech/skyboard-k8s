# TP4 — étape 4 : un Pod par nœud (agent de logs / monitoring simulé)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  labels: { app.kubernetes.io/name: node-agent }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: node-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: node-agent }
    spec:
      tolerations:                       # tourne aussi sur le control plane
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"$(date) agent sur $NODE_NAME : $(ls /var/log/pods | wc -l) pods logués\"; sleep 30; done"]
          env:
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          volumeMounts:
            - { name: podlogs, mountPath: /var/log/pods, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      volumes:
        - name: podlogs
          hostPath: { path: /var/log/pods }
