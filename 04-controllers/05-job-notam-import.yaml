# TP4 — étape 5 : tâche ponctuelle (run-to-completion). Mode simulation : pas encore de base (TP6).
apiVersion: batch/v1
kind: Job
metadata:
  name: notam-import
  labels: { app.kubernetes.io/name: notam-import, app.kubernetes.io/part-of: skyboard }
spec:
  completions: 3                 # 3 exécutions réussies attendues...
  parallelism: 2                 # ...au plus 2 en même temps
  backoffLimit: 2                # 2 échecs max avant Failed
  ttlSecondsAfterFinished: 600   # nettoyage automatique 10 min après la fin
  template:
    metadata:
      labels: { app.kubernetes.io/name: notam-import }
    spec:
      restartPolicy: Never       # obligatoire pour un Job : Never ou OnFailure
      containers:
        - name: import
          image: busybox:1.36
          command: ["sh", "-c", "echo \"import NOTAM $(date +%T) sur $(hostname)\"; for n in 1 2 3; do echo \"  NOTAM LFBO/$n analysé\"; sleep 3; done; echo termine"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
