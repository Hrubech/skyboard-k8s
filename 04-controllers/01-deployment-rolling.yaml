# TP4 — étape 1 : stratégie de mise à jour explicite, zéro indisponibilité
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skyboard-api
  labels:
    app.kubernetes.io/name: skyboard-api
    app.kubernetes.io/part-of: skyboard
  annotations:
    kubernetes.io/change-cause: "v1 initiale avec stratégie RollingUpdate"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  minReadySeconds: 5                 # un nouveau Pod doit rester Ready 5 s avant d'être compté
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1                    # au plus 4 Pods pendant la mise à jour
      maxUnavailable: 0              # jamais moins de 3 Pods prêts
  selector:
    matchLabels:
      app.kubernetes.io/name: skyboard-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skyboard-api
        app.kubernetes.io/part-of: skyboard
        app.kubernetes.io/version: v1
    spec:
      terminationGracePeriodSeconds: 20
      initContainers:
        - name: wait-redis
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z redis 6379; do sleep 2; done"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
      containers:
        - name: api
          image: k3d-registry.localhost:5000/skyboard-api:v1
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: AIRPORT, value: "LFBO" }
            - { name: REDIS_HOST, value: "redis" }
            - { name: SHUTDOWN_DELAY, value: "5" }
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 3"] }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 1
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
